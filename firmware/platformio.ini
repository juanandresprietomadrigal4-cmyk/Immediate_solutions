[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Unified Sensor@^1.1.14
build_flags =
    -DCORE_DEBUG_LEVEL=0
extra_scripts =
    pre:../tools/pio_prebuild.py
board_build.embed_txtfiles =
    embed/index.html
